<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <title>College AI — Intelligent College Information & Conversation Platform</title>
    <meta name="description" content="One unified, privacy-first platform for university syllabi, campus regulations, verified student records, and conversational guidance." />
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)" />
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="College AI — Institutional Intelligence Platform" />
    <meta property="og:description" content="One unified, privacy-first platform for university syllabi, campus regulations, verified student records, and conversational guidance." />
    <meta property="og:site_name" content="College AI" />
    
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="College AI — Institutional Intelligence Platform" />
    <meta name="twitter:description" content="One unified, privacy-first platform for university syllabi, campus regulations, verified student records, and conversational guidance." />
    
    <!-- Preconnect to Google Fonts for Inter and JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Synchronous theme blocking script to eliminate FOUC -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('college-ai-theme');
          var isDark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body class="bg-bg-primary text-text-primary antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
